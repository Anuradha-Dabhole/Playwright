name: Playwright Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run (smoke | regression | all)'
        required: false
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
          - all

env:
  TEST_ENVIRONMENT: qa
  BASE_URL: https://www.saucedemo.com
  CI: true

jobs:
  # ─── Smoke Tests (fast gate on every push) ──────────────────────────────────
  smoke-tests:
    name: Smoke Tests — Chromium
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.test_suite == 'smoke' || github.event.inputs.test_suite == 'all'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers (Chromium only for smoke)
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npx playwright test --project=smoke --reporter=list,html
        env:
          CI: true

      - name: Upload smoke test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-report
          path: playwright-report/
          retention-days: 14

      - name: Upload smoke test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-test-results
          path: test-results/
          retention-days: 7

  # ─── Full Regression Suite (PRs and manual triggers) ────────────────────────
  regression-tests:
    name: Regression Tests — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event.inputs.test_suite == 'regression' || github.event.inputs.test_suite == 'all'

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run regression tests — ${{ matrix.browser }}
        run: npx playwright test --project=${{ matrix.browser }} --reporter=list,html
        env:
          CI: true

      - name: Upload ${{ matrix.browser }} test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14

      - name: Upload ${{ matrix.browser }} test results on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: regression-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
